<style>
/* ===== V2 : thème sombre par défaut, thème clair au choix ===== */
:root{
  --bg:#0B1416; --surface:#142125; --surface2:#19292E; --sunk:#1E3036; --ink:#E9F1F0; --muted:#9DB2B7; --line:#273A40;
  --accent:#4FC9C0; --accent-ink:#04211E; --good:#5BD08D; --bad:#FF8A7A; --warn:#F2C14E;
  --c-did:#FF8A55; --c-inst:#7FA8FF; --c-hist:#4FD1A0; --c-philo:#B79BFF; --c-socio:#FF7FAE; --c-psy:#E8B04E; --c-ppp:#A3B5C2;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 28px -18px rgba(0,0,0,.9);
  --glow:radial-gradient(900px 420px at 85% -10%, rgba(79,201,192,.16), transparent 60%), radial-gradient(700px 380px at -10% 0%, rgba(127,168,255,.10), transparent 60%);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:16px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#F7FAF9; --sunk:#E4EBEA; --ink:#14232A; --muted:#51646C; --line:#D3DDDC;
  --accent:#0D6B67; --accent-ink:#FFFFFF; --good:#1E7A46; --bad:#B42318; --warn:#8A5A00;
  --c-did:#C2410C; --c-inst:#1D5FD1; --c-hist:#0F7B55; --c-philo:#7A4FD6; --c-socio:#B4235A; --c-psy:#8F5F0C; --c-ppp:#4B5D6B;
  --shadow:0 1px 2px rgba(20,35,42,.05), 0 12px 28px -20px rgba(20,35,42,.35);
  --glow:radial-gradient(900px 420px at 85% -10%, rgba(13,107,103,.10), transparent 60%), radial-gradient(700px 380px at -10% 0%, rgba(29,95,209,.07), transparent 60%);
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mc{--c:var(--accent)}
[data-m="did"]{--c:var(--c-did)} [data-m="inst"]{--c:var(--c-inst)} [data-m="hist"]{--c:var(--c-hist)} [data-m="philo"]{--c:var(--c-philo)} [data-m="socio"]{--c:var(--c-socio)} [data-m="psy"]{--c:var(--c-psy)} [data-m="ppp"]{--c:var(--c-ppp)}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sp{flex:1}

/* accueil */
.hero{padding-block:22px 8px;display:grid;gap:14px}
.count{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.count b{font-family:var(--display);font-size:clamp(56px,16vw,88px);font-weight:800;line-height:.85;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.count span{font-size:16px;color:var(--muted);padding-bottom:6px;max-width:28ch}
.count span strong{color:var(--ink)}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.week .what{font-family:var(--display);font-size:20px;font-weight:700}
.week .note{color:var(--muted);font-size:15px}
.sec{margin-top:26px;display:grid;gap:12px}
.sec>h2{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.tile:hover{border-color:var(--c)}
.tile:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.tile .ue{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tile h3{font-size:18px}
.tile .ep{font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .4s}
.tile .pct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.soon{font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.06em}

/* liste planning */
.plan{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan div{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.plan div:first-child{border-top:0}
.plan .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:2px}
.plan .t{min-width:0}
.plan .t small{display:block;color:var(--muted);font-size:14px}
.plan .t{position:relative;padding-left:16px}.plan .pdot{position:absolute;left:0;top:7px;width:9px;height:9px;border-radius:50%;background:var(--c)}.plan .d{line-height:1.25;font-size:12px}.plan .d b{display:block;font-size:15px;color:var(--ink)}.plan .now .d b{color:var(--accent)}.plan .t em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-left:8px;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--surface);vertical-align:2px}.plan .t em.ok{background:none;color:var(--muted);padding:0}.plan .past{opacity:.55}
.plan .now{background:color-mix(in srgb, var(--accent) 12%, var(--surface))}
.plan .now .d{color:var(--accent);font-weight:700}

/* entête matière */
.mhead{padding-block:20px 6px;display:grid;gap:10px}
.mhead .ue{color:var(--c);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.mhead h1{font-size:clamp(28px,7vw,38px);letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip.c{background:color-mix(in srgb, var(--c) 16%, var(--surface));color:var(--ink)}
.tabs{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 56px);z-index:4;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.pane{display:grid;gap:12px;padding-top:6px}

/* essentiel */
.fil{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;font-family:var(--display);font-size:clamp(19px,4.8vw,23px);font-weight:500;line-height:1.3;letter-spacing:-.01em}
.fil .eyebrow{display:block;margin-bottom:8px;font-family:var(--body)}
.keys{display:grid;gap:8px;counter-reset:k}
.key{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.key::before{counter-increment:k;content:counter(k);font-family:var(--display);font-weight:800;font-size:20px;color:var(--c);text-align:center}
.key div{min-width:0}
.plancours{display:flex;flex-wrap:wrap;gap:6px}
.plancours span{font-size:14px;padding:5px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}

/* fiches */
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fiche>button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:14px 16px;box-sizing:border-box}
.fiche>button:focus-visible{outline:3px solid var(--c);outline-offset:-3px}
.fiche h3{font-size:17px;flex:1;min-width:0}
.fiche .tag{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.fiche.done .dot{background:var(--c);border-color:var(--c);color:var(--surface)}
.chev{transition:transform .2s;color:var(--muted)}
.fiche.open .chev{transform:rotate(180deg)}
.fbody{padding:0 16px 14px;display:grid;gap:10px}
.fbody ul{margin:0;padding-left:20px;display:grid;gap:6px}
.fbody li::marker{color:var(--c)}
.fbody .q{border-left:3px solid var(--c);padding:6px 0 6px 12px;font-style:italic;color:var(--ink);background:none}

/* flashcards */

/* quiz */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}

.opt b{font-family:var(--display);color:var(--c);min-width:18px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb, var(--good) 12%, var(--surface))}

.expl{font-size:15px;border-radius:12px;padding:12px 14px;background:var(--sunk)}
.qprog{height:4px;background:var(--sunk);border-radius:9px;overflow:hidden}

/* citations & sujets */
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}

.reveal{all:unset;cursor:pointer;font-weight:700;color:var(--c);font-size:15px}
.ans{font-size:15px;color:var(--ink);background:var(--sunk);border-radius:10px;padding:10px 12px}
.ans b{color:var(--c)}
.sujet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}

/* comparateur */
.cmp{display:grid;gap:10px}
.cmpcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}

/* frise */
.frise{position:relative;display:grid;gap:0;padding-left:22px}

.ev{position:relative;padding:8px 0 12px}
.ev::before{content:"";position:absolute;left:-20px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c)}
.ev.key19::before{background:var(--c)}

.ev .l{font-weight:700}
.ev .x{color:var(--muted);font-size:15px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px}
.method{display:grid;gap:8px}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.reset{all:unset;cursor:pointer;text-decoration:underline}

.fig{margin:0;display:grid;gap:6px}
.zoom{all:unset;cursor:zoom-in;display:block;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:6px}

.lb{position:fixed;inset:0;z-index:50;background:rgba(8,14,16,.92);display:grid;place-items:center;align-content:center;gap:12px;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:78vh;background:#fff;border-radius:8px}
.lb p{color:#E7EFEE;margin:0;font-size:14px;text-align:center;max-width:60ch}

.media{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.media.done{opacity:.6}
.mtop{display:flex;gap:6px;flex-wrap:wrap}
.mty,.mob{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.mob{background:color-mix(in srgb, var(--c) 16%, var(--surface));color:var(--ink)}
.mlink{color:var(--ink);font-weight:700;font-size:17px;text-decoration:underline;text-decoration-color:var(--c);text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:640px){.three{grid-template-columns:repeat(3,1fr)} .three .cmpcard{align-content:start}}

/* ===== V2 : compléments visuels ===== */

body{background:var(--glow) no-repeat, var(--bg);min-height:100vh;transition:background-color .25s,color .25s}
.wrap{padding-block:0 110px}
.top .wrap{padding-block:10px}
svg{display:block}

.icon:hover{border-color:var(--accent);color:var(--accent)}
.epm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.h2{font-size:19px;margin-top:8px}

.pane>*, .hero>*, .sec, .quick{animation:rise .32s both cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}

/* anneaux */

.exam{background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,var(--line));border-radius:var(--r);padding:16px 18px;display:grid;gap:8px}

.btn{transition:transform .1s,filter .15s}

.setcard:hover{transform:translateX(3px);border-color:var(--c,var(--accent))}

  {t:"La didactique",tag:"définition",b:`<ul><li>Du grec <i>didaskein</i>, enseigner : la discipline qui étudie l’enseignement et l’acquisition des connaissances.</li><li>Elle s’intéresse d’abord au <b>contenu</b> : on n’enseigne pas la poésie comme les maths.</li><li>Didactique générale ou didactiques disciplinaires (maths, français, EPS…).</li><li>Naît fin 1960-début 1970 avec la réforme des « maths modernes ». Le mot s’impose avec <b>Guy Brousseau</b> (on hésitait avec « épistémologie expérimentale »).</li><li>Courants : champs conceptuels (Vergnaud), action conjointe (Sensevy, Mercier, Schubauer-Leoni), didactique professionnelle (Pastré).</li></ul>`},

  {t:"Le socioconstructivisme",tag:"Vygotski",b:`<ul><li>Le développement naît de la rencontre avec le groupe.</li><li><b>Zone proximale de développement</b> : ce que l’enfant réussit avec une aide adaptée.</li><li><b>Conflit sociocognitif</b> : confronter ses représentations à celles des pairs.</li><li>Bruner : la « fonction d’étayage » de l’adulte.</li><li>Limites : long, peu compatible avec le programme, inadapté aux savoirs arbitraires.</li></ul>`},
  {t:"Qu’est-ce que le savoir ?",tag:"Astolfi 2008",b:`<ul><li>Astolfi, <i>La saveur des savoirs</i> : les concepts disciplinaires sont « les caravelles de la connaissance ».</li><li>Vincent (2020) : une proposition qui résiste à l’épreuve de faillibilité.</li><li>Mayen (2013) : des <b>savoirs robustes</b>, pertinents, consistants, durables.</li><li>Serres, <i>Petite Poucette</i> (2012) : « Que transmettre ? Le savoir ! »</li><li>Enseigner va du simple au complexe ; apprendre part du complexe (Astolfi). Sensevy parle du « chrono-maître ».</li></ul>`},
  {t:"La transposition didactique",tag:"Chevallard 1985",b:`<ul><li>Concept formalisé par Chevallard d’après le sociologue Verret (1975).</li><li>Savoir savant → savoir à enseigner : transposition <b>externe</b> (l’institution, les programmes).</li><li>Savoir à enseigner → savoir enseigné : transposition <b>interne</b> (la classe).</li><li>Ce n’est pas une simplification mais une « substitution d’objet ».</li><li>Autre source : les <b>pratiques sociales de référence</b> (Martinand, 1986), par exemple les gestes professionnels.</li></ul>`},
  {t:"Le rapport au savoir",tag:"Charlot 1997",b:`<ul><li>Trois courants : clinique (Beillerot, Blanchard-Laville, Mosconi), sociologique (Charlot, Bautier, Rochex), anthropologique (Chevallard).</li><li>Charlot : l’ensemble des relations qu’un sujet entretient avec tout ce qui touche à l’apprendre et au savoir.</li><li>Jourdan (2013) : un « révélateur » des logiques professionnelles.</li><li>Pour certains élèves, réussir dépend « de la chance… ou de la bonne humeur du prof ».</li></ul>`},

  {t:"La situation-problème",tag:"Astolfi 2008",b:`<ul><li>Organisée autour d’un <b>obstacle</b> préalablement identifié.</li><li><b>Dévolution</b> : le problème devient « leur affaire ».</li><li>Résistance suffisante, mais solution atteignable (zone proximale).</li><li>Débat scientifique, validation par la situation, retour métacognitif.</li><li>Exemple du cours : Dalongeville, 14-18 au cycle 3, journaux contre témoignages de poilus.</li><li>Fin de séance : l’<b>institutionnalisation</b> formalise le savoir.</li></ul>`},
  {t:"Représentations et obstacles",tag:"Bachelard 1938",b:`<ul><li>Représentation : un modèle personnel d’organisation des connaissances (Migne, 1970).</li><li>Métaphore de l’<b>iceberg</b> (Jonnaert, 1988) : surface visible, hypothèses profondes.</li><li><b>Obstacle épistémologique</b> : la pensée commune à renverser (exemple des corps flottants).</li><li>Il faut « changer de culture expérimentale ».</li></ul>`},

inst:{ ue:"UE A", nom:"Institutions scolaires", ep:"Écrit 1h", ects:"UE A · 12 ECTS",
 fil:"Jusqu’au XIXe siècle, l’éducation n’est pas organisée par une puissance publique. Au XIXe, l’État structure l’enseignement en deux ordres qui ne se croisent pas : le primaire pour le peuple, le secondaire pour les notables.",
 plan:["Le découpage du temps","De l’Antiquité à la Révolution","Le XIXe siècle français"],

  "Pour chaque institution, pose les <b>5 questions</b> : qui forme-t-on et pourquoi, quels contenus, où, qui paye, quels acteurs.",
  "Au Moyen Âge, c’est l’<b>Église</b> qui forme, d’abord les futurs clercs.",
  "La période moderne invente la <b>classe par niveau</b> et les collèges (jésuites).",
  "Le XIXe siècle : l’<b>État</b> organise deux ordres ; les lois Ferry (1881-1882) généralisent le primaire sans viser l’ascenseur social."
 ],
 fiches:[
  {t:"Institution : définition et grille",tag:"méthode",b:`<ul><li>Un ensemble de missions, de règles de conduite et de pratiques, doté d’une finalité, qui n’existe que par ceux qui la composent.</li><li>Les 5 questions du cours : qui forme-t-on et pour quoi ? quels contenus ? quels lieux ? qui paye ? quels acteurs ?</li><li>Périodes : Antiquité (−3000 → 476), Moyen Âge (Ve → XVe), moderne (XVe → 1789), contemporaine (1789 →).</li></ul>`},
  {t:"Sparte",tag:"VIe s. av. J.-C.",b:`<ul><li>Éducation prise en charge par la cité, collective et militaire.</li><li>Famille jusqu’à 7 ans, puis l’État jusqu’à 20 ans ; internat dès 12 ans.</li><li>Austérité, résistance à la douleur, patriotisme jusqu’au sacrifice.</li><li>Filles : sport et gymnastique, pour être des mères d’enfants vigoureux.</li></ul>`},
  {t:"Athènes",tag:"Ve s. av. J.-C.",b:`<ul><li>La démocratie appelle l’école pour tous les hommes libres.</li><li>Trois maîtres : <b>pédotribe</b> (sport, palestre), <b>cithariste</b> (musique), <b>grammatiste</b> (lettres).</li><li>Sophistes : former l’homme d’État. Socrate : la vertu morale.</li><li><b>Platon</b> ouvre l’Académie (387 av. J.-C.), fondée sur la vérité. <b>Isocrate</b> : une école payante d’éloquence.</li></ul>`},
  {t:"Époque hellénistique",tag:"paideia",b:`<ul><li><i>Paideia</i> : se faire soi-même selon un idéal d’humanité.</li><li>Famille jusqu’à 7 ans, école de 7 à 14 ans, poètes classiques à l’adolescence, puis éphébie (civique et militaire).</li><li>Écoles surtout privées, payées par les familles.</li></ul>`},
  {t:"Le Moyen Âge et l’Église",tag:"Ve-XVe",b:`<ul><li>L’Église remplace les écoles romaines pour former les clercs.</li><li>Écoles <b>monastiques</b> (oblats de 7 à 12 ans), <b>paroissiales</b> (concile de Vaison, 529), <b>cathédrales</b>.</li><li>Saint Benoît (vers 540) : modération des châtiments.</li><li>Dès le XIIe : « petites écoles » urbaines pour fils de marchands et d’artisans.</li></ul>`},
  {t:"L’Université de Paris",tag:"XIIe-XIIIe",b:`<ul><li><i>Universitas</i> = la corporation des maîtres.</li><li>4 privilèges : collation des grades, autonomie administrative, judiciaire, financière.</li><li>4 facultés vers 1220 : arts, droit, médecine, théologie.</li><li><i>Licencia docendi</i> : permission d’enseigner.</li><li>99 % d’étudiants nobles ou bourgeois. Collège de la <b>Sorbonne</b> (1253) pour étudiants pauvres.</li></ul>`},
  {t:"Réforme et humanisme",tag:"XVe-XVIe",b:`<ul><li>Gerson ouvre la voie d’une pédagogie chrétienne.</li><li>Érasme, <i>De l’éducation des enfants</i> (1529) : jeux, images, pas de châtiments.</li><li>Bodin (1559) : une école publique pour tous.</li><li>Protestants : lire la Bible soi-même. Luther (1524), Calvin (1542, instruction publique et obligatoire à Genève).</li><li>Édit de Châteaubriant (1551), puis édit de Nantes (1598).</li></ul>`},
  {t:"Collèges et jésuites",tag:"XVIe",b:`<ul><li>Vers 1530, Frères de la Vie commune : <b>classes par niveau</b>, examen de passage, horaires stricts.</li><li>Compagnie de Jésus (Ignace de Loyola, 1539), collège de Rome (1551), <i>Ratio Studiorum</i>.</li><li>12 collèges jésuites en France en 1572.</li></ul>`},
  {t:"Les petites écoles charitables",tag:"XVIIe",b:`<ul><li>Charles <b>Démia</b>, <i>Remontrances</i> (1666) ; premier séminaire de formation des maîtres à Lyon (1672).</li><li>Jean-Baptiste <b>de La Salle</b> : Frères des écoles chrétiennes (1684 dans ce cours), école normale d’instituteurs à Reims (1685).</li><li>Les élites craignent qu’instruire le peuple menace l’ordre social.</li></ul>`},
  {t:"Lycées et Université impériale",tag:"1802-1821",b:`<ul><li>Loi du 1er mai 1802 : les <b>lycées</b>, pour former les futurs administrateurs ; humanités, payant, garçons aisés.</li><li>1806 : <b>Université impériale</b>, premier corps enseignant national et laïque.</li><li>Carrières, grille de salaire, baccalauréat ; <b>agrégation</b> dès 1821.</li><li>1 garçon sur 45 scolarisé dans le secondaire en 1842 (Prost).</li></ul>`},
  {t:"Diversifier le secondaire",tag:"1852-1902",b:`<ul><li>1852 : la <b>bifurcation</b> de Fortoul, voies littéraire et scientifique après la 4e.</li><li>Duruy : l’<b>enseignement secondaire spécial</b> pour « des industriels, des négociants, des agriculteurs », devenu « moderne » en 1891.</li><li>1902 : deux cycles, sections classique et moderne.</li></ul>`},
  {t:"Les filles",tag:"1867-1880",b:`<ul><li>Loi Duruy (10 avril 1867) : une école de filles dans les communes de plus de 500 habitants.</li><li>Loi <b>Camille Sée</b> (21 déc. 1880) : lycées de jeunes filles, sans latin ni bac.</li></ul>`},
  {t:"Le primaire, de Guizot à Goblet",tag:"1833-1886",b:`<ul><li><b>Guizot</b> (28 juin 1833) : une école par commune, écoles normales, inspection, EPS dans les villes de plus de 6 000 habitants.</li><li><b>Paul Bert</b> (1879) : une école normale par département.</li><li><b>Ferry</b> 1881 : gratuité ; 1882 : obligation de 6 à 13 ans et programmes laïcs.</li><li><b>Goblet</b> (1886) : laïcisation du personnel, instituteurs fonctionnaires.</li></ul>`},

hist:{ ue:"UE A", nom:"Histoire des idées éducatives", ep:"Écrit 1h30", ects:"UE A · 12 ECTS",
 fil:"Trois pédagogues de l’éducation nouvelle déplacent la forme scolaire en mettant l’enfant au centre. Chacun s’explique par son contexte, qu’il faut toujours rappeler.",
 plan:["L’éducation nouvelle","Maria Montessori","Célestin Freinet","Loris Malaguzzi et Reggio Emilia"],
 keys:[
  "Un <b>pédagogue</b> est un « praticien-théoricien de son action éducative » (Houssaye, 1994).",
  "Analyse chaque pédagogue selon 3 dimensions : <b>axiologique</b> (valeurs), <b>scientifique</b> (fondements), <b>praxéologique</b> (outils) — d’après Meirieu.",
  "L’<b>éducation nouvelle</b> : méthodes actives, partir des intérêts de l’enfant, éducation globale.",
  "Ne cherche pas dans le passé des recettes : le contexte sociohistorique est déterminant."
 ],
 fiches:[
  {t:"L’éducation nouvelle",tag:"contexte",b:`<ul><li>Écoles d’élite : Reddie, Abbotsholme (1889) ; Demolins, École des Roches (1899).</li><li>Éducation libertaire et intégrale : Paul Robin à Cempuis (1880-1894), Sébastien Faure et La Ruche (1904).</li><li>John <b>Dewey</b> : école-laboratoire de Chicago (1896), apprendre en agissant ; il refuse pourtant l’opposition programme / enfant.</li><li>Ferrière : Bureau international des écoles nouvelles (1899), charte (1915), <b>Ligue internationale pour l’éducation nouvelle</b> (1921), pacifiste.</li><li>Claparède : Institut Jean-Jacques Rousseau (Genève, 1912).</li></ul>`},
  {t:"Montessori : parcours",tag:"1870-1952",b:`<ul><li>Médecin (Rome, 1896), d’abord auprès d’enfants déficients ; inspirée par Itard et Séguin.</li><li>1907 : <i>Casa dei bambini</i>, quartier populaire de San Lorenzo.</li><li><i>La pédagogie scientifique</i> (1909), AMI (1929), <i>L’Enfant</i> (1935-1936).</li><li>Exil sous Mussolini ; Inde 1939-1946 ; meurt aux Pays-Bas en 1952.</li></ul>`},
  {t:"Montessori : valeurs",tag:"axiologique",b:`<p class="q">« Aide-moi à faire tout seul. »</p><ul><li><b>Autonomie</b> : elle se construit, elle n’est pas donnée.</li><li><b>Liberté</b> de choisir son activité, après une présentation du matériel.</li><li><b>Respect du rythme</b> : classes multi-âges 0-3, 3-6, 6-9, 9-12.</li><li>Critiques : Durler (2015), l’autonomie est une construction sociale source d’inégalités ; Foray (2016), risque d’abandon.</li></ul>`},
  {t:"Montessori : fondements et outils",tag:"scientifique · praxéo",b:`<ul><li>L’adulte <b>observe</b> comme un médecin ; il ne domine pas, « il ne professe pas ».</li><li><b>Périodes sensibles</b> : des sensibilités passagères propices à une acquisition.</li><li><b>Matériel sensoriel</b> : un objet, un usage ; l’erreur sert à s’auto-évaluer.</li><li>Mobilier à la taille de l’enfant ; objets fragiles qui éduquent le geste.</li><li>Aujourd’hui : environ 400 écoles en France, souvent privées et coûteuses.</li></ul>`},
  {t:"Freinet : parcours",tag:"1896-1966",b:`<ul><li>Instituteur, blessé au Chemin des Dames (1917), 70 % d’invalidité.</li><li>Inspirations : libertaire (Ferrer → « École moderne »), révolution russe, éducation nouvelle.</li><li>Imprimerie en classe (1924), CEL (1928), BT (1932).</li><li><b>Affaire de Saint-Paul</b> (1932-1933) : il quitte l’école publique ; école de Vence (1935).</li><li>ICEM (1947), FIMEM (1957). Travaille en couple avec Élise Freinet.</li></ul>`},
  {t:"Freinet : principes",tag:"axiologique · scientifique",b:`<ul><li>Une école d’émancipation pour les enfants du peuple, pacifique.</li><li><b>Tâtonnement expérimental</b> : étonnement → recherche → discussion → expérimentation → lois.</li><li><b>Coopérative scolaire</b> : cogestion, partage des responsabilités.</li><li>Pas d’encre rouge, pas de note ni de classement : auto-évaluation.</li><li>Il refuse de laisser l’enfant aller seulement « au gré de ses fantaisies ».</li></ul>`},
  {t:"Freinet : outils",tag:"praxéologique",b:`<ul><li><b>Imprimerie</b> et livre de vie à la place du manuel.</li><li>Texte libre, correspondance scolaire (née avec René Daniel).</li><li><b>Plan de travail</b> négocié, <b>brevets</b> (inspirés des Compagnons du Devoir).</li><li><b>Invariants pédagogiques</b> avec code vert / orange / rouge.</li><li>Héritage : conseils de classe ; mais une pédagogie souvent réduite à ses outils.</li></ul>`},
  {t:"Malaguzzi : origines",tag:"1920-1994",b:`<ul><li>Après la guerre, les habitants de Villa Cella bâtissent une maternelle pour initier les enfants à la démocratie contre le fascisme.</li><li>1963 : première maternelle municipale de Reggio Emilia (Robinson Crusoé).</li><li>Exposition « Les cent langages de l’enfant » (années 1980) ; école Diana primée par <i>Newsweek</i> (1991).</li><li>Reggio Children (1994) ; 34 crèches et maternelles municipales.</li><li>Le cours écrit « 1945 » pour l’entrée en guerre de l’Italie : c’est 1940.</li></ul>`},
  {t:"Malaguzzi : valeurs et outils",tag:"Reggio Emilia",b:`<ul><li>L’école comme place publique de la démocratie (Rinaldi, 2006) ; l’enfant citoyen à part entière.</li><li><b>Communauté éduquante</b> : parents, élèves, enseignants.</li><li>Enfant compétent, créatif, en quête de sens.</li><li><b>Cent langages</b> : toutes les façons de s’exprimer (parole, dessin, corps, son, lumière…).</li><li>Duo d’enseignants, <i>atelierista</i>, <i>pedagogista</i>, projet, <b>documentation</b> ; l’ambiance comme éducatrice.</li></ul>`}
 ],

philo:{ ue:"UE B", nom:"Philosophie de l’éducation", ep:"Écrit 1h30", ects:"UE B · 15 ECTS",
 fil:"La philosophie commence « là où les choses ne vont plus de soi » (Reboul). Elle interroge les fins de l’éducation, pas seulement ses moyens, parce qu’aucun moyen n’est neutre.",
 plan:["Cours 1 · Qu’est-ce que la philosophie de l’éducation ?","Cours 2 · Former la pensée","Comment faire apprendre ?","Que faut-il enseigner ?","Éducation scientifique","Éducation artistique et esthétique"],
 keys:[
  "L’éducation est une nécessité <b>anthropologique</b> (Kant) et <b>politique</b> (Aristote, Platon, Condorcet).",
  "6 <b>méthodes</b> (Reboul + Kerlan) et 5 <b>antinomies</b> : tes plans de dissertation tout faits.",
  "3 <b>fonctions</b> : élucidatrice, axiologique, épistémologique.",
  "Cours 2 : former la <b>pensée réfléchie</b> (Dewey), émanciper (Kant, Rancière), choisir une <b>culture</b> à transmettre (Forquin, Williams), sans oublier <i>Homo aestheticus</i> (Kerlan)."
 ],
 fiches:[
  {t:"Pourquoi philosopher en éducation",tag:"cours 1",b:`<ul><li>Kant : l’homme n’est ce qu’il est que par l’éducation ; l’enfance humaine est la plus longue.</li><li>Aristote : l’homme est un « animal politique ». Platon, <i>La République</i> : la Cité juste passe par l’éducation.</li><li>Rousseau écrit <i>Émile</i> et <i>Contrat social</i> ensemble ; Condorcet, <i>Cinq mémoires</i> : l’égalité de fait.</li><li>Arendt (1972) : une crise renvoie à l’essence de ce qui est en crise.</li><li>Fabre : maintenir « une ouverture du sens » face aux experts.</li></ul>`},
  {t:"Totale, radicale, vitale",tag:"Reboul",b:`<ul><li><b>Totale</b> : on peut philosopher sur tout.</li><li><b>Radicale</b> : non pas comment guérir la dyslexie, mais quel sens a le fait de savoir lire.</li><li><b>Vitale</b> : elle engage notre vie et notre responsabilité.</li><li>« Dès qu’un éducateur réfléchit sur le sens de son entreprise […] il philosophe. »</li></ul>`},
  {t:"Les 6 méthodes",tag:"Reboul 1989",b:`<ul><li><b>Histoire de la philosophie</b> : un réservoir de problématiques.</li><li><b>Réflexion sur les sciences</b> : vigilance épistémologique (neurosciences, Arphé 2020).</li><li><b>Analyse logique</b> : ce qu’on veut dire par un mot ; les 5 discours de Reboul (contestataire, novateur, fonctionnel, humaniste, officiel).</li><li><b>Argument a contrario</b> : l’enseignement n’est ni dressage, ni conditionnement, ni propagande.</li><li><b>Dialectique</b> : thèse, antithèse, synthèse (Dewey, « L’intérêt et l’effort »).</li><li><b>Phénoménologie</b> (Kerlan) : décrire le donné avant d’expliquer.</li></ul>`},
  {t:"Les 5 antinomies",tag:"plans de copie",b:`<ul><li>Le sophiste et les savoirs.</li><li>La contrainte et le désir.</li><li>La transmission et la spontanéité.</li><li>L’incertitude et la technicité.</li><li>La rupture et la continuité.</li></ul><p>Chaque antinomie = une thèse, une antithèse, une synthèse à construire.</p>`},
  {t:"Les 3 fonctions",tag:"Avanzini 1993",b:`<ul><li><b>Élucidatrice</b> : interpréter ce qu’éduquer signifie dans une société (Nietzsche ; Kerlan sur l’EAC ; le succès de Montessori).</li><li><b>Axiologique</b> : les fins et les valeurs, « pas d’éducation sans valeurs ». Fabre après Bachelard : « la Société sera faite pour l’École ».</li><li><b>Épistémologique</b> : examen critique des sciences de l’éducation, local et global.</li><li>Pièges : philosophie « de service » et « supplément d’âme » (Fabre).</li></ul>`},
  {t:"Philosophie pour l’éducation",tag:"Kerlan 2013",b:`<ul><li>Tout éducateur qui réfléchit rencontre des questions philosophiques.</li><li>Garder la capacité de s’étonner (Aristote) : la balance de Rousseau, Itard et Victor.</li><li>3 domaines : philosophie générale (fins), 4 champs (intellectuel, moral et politique, esthétique, corps), pédagogie.</li></ul>`},
  {t:"Kant et la discipline",tag:"cours 2",b:`<ul><li>Les « germes » de l’humanité à développer.</li><li>Éducation = soins, discipline, instruction.</li><li>« La discipline nous fait passer de l’état d’animal à celui d’homme. »</li></ul>`},
  {t:"Qu’est-ce que penser ?",tag:"Dewey · Descartes",b:`<ul><li>Dewey, <i>Comment nous pensons</i> : seule la <b>pensée réfléchie</b> a valeur éducative.</li><li>Elle naît de l’incertitude, du doute, du problème.</li><li>Descartes : une chose qui pense doute, conçoit, affirme, nie, veut, imagine et sent.</li></ul>`},
  {t:"Culture, Lumières, émancipation",tag:"Durkheim · Kant",b:`<ul><li>Durkheim : « former un esprit au moyen des lettres, de l’histoire, des mathématiques ».</li><li><i>Bildung</i> : éducation et culture en un mot.</li><li>Condorcet et le « cultivateur éclairé ».</li><li>Kant (1784) : sortir de l’état de tutelle, <i>Sapere aude</i>.</li><li>Rousseau critique : pas de livres avant 12 ans.</li></ul>`},
  {t:"Le maître ignorant",tag:"Rancière",b:`<ul><li>D’après Jacotot : apprendre le français avec le <i>Télémaque</i> bilingue, sans expliquer.</li><li>« L’explication est le mythe de la pédagogie » : l’explicateur fabrique l’incapable.</li><li>Critique de Socrate et de l’esclave du <i>Ménon</i>.</li><li>Émanciper = <i>ex-mancipare</i>, échapper des mains (Moreau).</li><li>Kerlan : des « élèves définitifs ».</li></ul>`},
  {t:"Que faut-il enseigner ?",tag:"Forquin · Williams · Hirst",b:`<ul><li>Forquin (1996) : on n’enseigne vraiment que ce qu’on juge valable.</li><li><b>Curriculum</b> : plus large que le programme ; <b>curriculum caché</b>.</li><li>Williams : une <b>culture commune</b> ; 3 conceptions en conflit (libérale, démocratique, utilitariste).</li><li>Hirst : des « formes de connaissance » ; reproche d’hyper-intellectualisme.</li><li>Culture vécue : Kambouchner, Todorov ; « faire œuvre de soi-même » (Pestalozzi).</li></ul>`},
  {t:"Éducation scientifique",tag:"Durkheim · Bachelard",b:`<ul><li>1902 : un « humanisme scientifique ». Comte : loi des 3 états.</li><li>Durkheim : l’idée éducative chrétienne = <b>totalité, unité, intériorité</b> (le <i>convict</i>).</li><li>Bachelard (1938) : obstacles épistémologiques (expérience première, obstacle verbal).</li><li>L’esprit scientifique « doit se former en se réformant » : un ensemble d’erreurs rectifiées.</li></ul>`},
  {t:"Art et éducation",tag:"Platon → Kerlan",b:`<ul><li>Suspicion : Platon (l’artiste fabrique des illusions), Durkheim (« un germe d’immoralité »).</li><li>EAC : fréquenter les œuvres, rencontrer les artistes, pratiquer, connaître (charte 2016).</li><li>Aristote : catharsis. Hegel : éveil de l’âme, perfectionnement moral.</li><li>Kant : « Est beau ce qui plaît universellement sans concept ». Schiller : la beauté mène à la liberté.</li><li>Dewey, <i>L’art comme expérience</i> (1934) ; Schaeffer ; Kerlan : <i>Homo aestheticus</i>.</li></ul>`}
 ],

socio:{ ue:"UE B", nom:"Sociologie de l’éducation", ep:"Écrit 1h30", ects:"UE B · 15 ECTS",
 fil:"L’école reproduit les inégalités sociales par la culture qu’elle transmet (l’arbitraire culturel) et par sa pédagogie (l’indifférence aux différences). Soixante ans après Bourdieu et Passeron, ces mécanismes persistent sous des formes plus discrètes.",
 plan:["L’apparition du problème de l’échec scolaire","L’école reproductrice","L’arbitraire culturel renouvelé","Pédagogies et maintien des inégalités","La forme scolaire invisible"],
 keys:[
  "L’échec scolaire ne devient un <b>problème social</b> qu’après 1950, quand l’école se veut ascenseur méritocratique.",
  "Bourdieu et Passeron : <b>arbitraire culturel</b> + <b>capital culturel</b> + <b>indifférence aux différences</b>.",
  "Lahire : l’école attend un rapport <b>scriptural-scolaire</b> au langage ; les milieux populaires ont un rapport oral-pratique.",
  "Les <b>pédagogies actives</b> peuvent aggraver les inégalités : savoir invisible, saut cognitif, surajustement."
 ],
 fiches:[
  {t:"Pourquoi l’échec devient un problème",tag:"introduction",b:`<ul><li>Lois Ferry : cohésion nationale, pas ascenseur social ; deux ordres.</li><li>Après 1950 : l’école au cœur d’une société « méritocratique », une « société des diplômes » (Millet et Moreau).</li><li>L’échec devient un « problème social » (Isambert-Jamati, 1984).</li><li>Durkheim : le sociologue doit « exprimer le réel, non le juger ».</li></ul>`},
  {t:"Le constat statistique",tag:"chiffres",b:`<ul><li>« Explosion scolaire » : 740 000 élèves en primaire en 1945, 3,8 millions en 1968.</li><li>Enquêtes INED (Girard, Bastide, Pourcher, 1963).</li><li>2017 : 21 % d’enfants d’inactifs en retard en 6e contre 2,4 % d’enfants de cadres.</li><li>Brevet : 96,9 % (cadres), 82,6 % (ouvriers), 72,9 % (inactifs).</li><li>Le mot « méritocratie » naît d’une dystopie : Young (1958).</li></ul>`},
  {t:"Arbitraire et capital culturels",tag:"Bourdieu & Passeron",b:`<ul><li><b>Arbitraire culturel</b> : l’école transmet la culture des classes supérieures comme si elle était universelle (Zola et Mozart, pas la BD ni le rock).</li><li><b>Capital culturel</b> : bien parler, bien se tenir, bon goût ; transmis par la socialisation familiale.</li><li>Il explique mieux la réussite que l’argent : les enfants d’enseignants réussissent le mieux.</li><li>« Les trois états du capital culturel » (1979). Critique de l’héritage : Henri-Panabière (2010).</li></ul>`},
  {t:"Indifférence aux différences",tag:"pédagogie implicite",b:`<ul><li>L’école traite comme « égaux en droits » des individus « inégaux en fait ».</li><li><b>Pédagogie implicite</b> : les attentes ne sont pas dites.</li><li>Remède proposé : une <b>pédagogie rationnelle</b>.</li><li>L’<b>idéologie du don</b> naturalise les inégalités ; le concours transforme le privilège en mérite.</li></ul>`},
  {t:"Lahire et la logique scolaire",tag:"1993",b:`<ul><li><i>Culture écrite et inégalités scolaires</i>, d’après Goody.</li><li>L’école attend un rapport <b>scriptural</b> au langage : le langage pour lui-même (faire des phrases complètes).</li><li>Les enfants des milieux populaires ont un rapport <b>oral-pratique</b> : le langage comme outil.</li><li><b>Appropriation hétérodoxe</b> : une autre logique, pas un « handicap socio-culturel ».</li></ul>`},
  {t:"Un arbitraire qui se complexifie",tag:"Eloy · Bautier · Bonnéry",b:`<ul><li>Éducation musicale (Eloy, 2013) : le rap entre au programme, mais l’analyse attendue reste formelle et plus exigeante.</li><li>Le niveau ne baisse pas, il se déplace : de la mémorisation-restitution à la compréhension (Joshua, 1999).</li><li>Manuels (Bautier, Bonnéry, Kakpo, 2015) : notions abstraites, documents à relier ; un <b>élève connivent</b> supposé.</li></ul>`},
  {t:"La logique scolaire hors de l’école",tag:"extension",b:`<ul><li>Maternelle scolarisée (Garnier, 2009), obligation dès 3 ans (2019).</li><li>Écoles de musiques actuelles (Deslyper) : il faut « comprendre » ce qu’on joue.</li><li>Centres de loisirs (Kéchichian) : « jouer » (orthodoxe) contre « s’amuser » ; l’exemple des Kapla.</li><li>Albums jeunesse (Bonnéry, 2015) : du Père Castor aux albums-énigmes qui exigent une lecture partagée.</li></ul>`},
  {t:"Pédagogie visible ou invisible",tag:"Bernstein 1975",b:`<ul><li><b>Classification</b> : netteté des frontières entre activités.</li><li><b>Cadrage</b> : contrôle de la communication enseignant-élèves.</li><li>Visible = classification nette + cadrage fort. Invisible = classification floue + cadrage faible.</li></ul>`},
  {t:"Les pédagogies actives en question",tag:"ESCOL",b:`<ul><li>Une phase pratique, puis un <b>saut cognitif</b> que certains élèves ne font pas (le circuit électrique).</li><li>« L’apparence de déscolarisation masque une hyperscolarisation implicite » (Bonnéry, 2007).</li><li><b>Dénivellement</b> : questions faciles aux « faibles ».</li><li><b>Malentendu sociocognitif</b> : l’élève travaille « à côté » et l’enseignant croit qu’il apprend.</li></ul>`},
  {t:"Maternelle et surajustement",tag:"Joigneaux · Millet & Croizet",b:`<ul><li>Le regroupement-atelier masque l’enjeu (Joigneaux, 2009).</li><li><b>Surajustement didactique</b> : baisser l’exigence pour les élèves en difficulté.</li><li>Millet et Croizet (2016) : le jeu brouille l’enjeu ; la comparaison aux autres dégrade les performances.</li><li>Piste : une « école de l’exigence intellectuelle » (Terrail, 2016).</li></ul>`},
  {t:"Détour et désinvestissement",tag:"chapitre 3",b:`<ul><li><b>Pédagogie du détour</b> (ateliers relais) : peu de transmission, transfert non accompagné (Claude et Rayou, 2020).</li><li>Focalisation sur le comportement ; « stratégie de survie » (Woods, 1990).</li><li><b>Externalisation</b> des difficultés : famille, motivation, troubles « dys » (Garcia, Morel) = idéologie du don déguisée.</li><li>Conclusion : la forme scolaire domine d’autant plus qu’elle est invisible (Rayou).</li></ul>`},
  {t:"Lien avec le terrain",tag:"exemple de copie",b:`<ul><li>Une activité réussie « matériellement » sans que l’élève comprenne le principe : saut cognitif manqué et malentendu sociocognitif.</li><li>Une consigne allégée pour les « faibles » : risque de surajustement didactique.</li><li>Expliciter l’enjeu de savoir en début et fin de séance : réponse à la pédagogie invisible.</li></ul>`}
 ],

M.psy={ ue:"UE B", nom:"Psychologie de l’éducation", ep:"QCM sur table · 30 min", ects:"UE B · 15 ECTS", isNew:1,
 fil:"Trois grandes familles expliquent comment on apprend : le béhaviorisme (on modifie un comportement), le constructivisme et le socioconstructivisme (on construit ses connaissances, avec les autres), le cognitivisme (on traite de l’information). Enseigner, c’est organiser les conditions de l’apprentissage en tenant compte de la mémoire, de l’attention et des émotions.",
 plan:["Introduction : doctrines, apprendre, enseigner","Le béhaviorisme","Romantisme, constructivisme, socioconstructivisme","Le cognitivisme"],
 keys:[
  "Apprendre selon <b>trois modes</b> (Aumont et Mesnier, 1992) : conditionnement, construction progressive, traitement de l’information.",
  "<b>Béhaviorisme</b> : Pavlov (conditionnement classique), Thorndike (essai-erreur, lois de l’exercice et de l’effet), Skinner (conditionnement opérant).",
  "<b>Piaget</b> : assimilation, accommodation, équilibration. <b>Vygotsky</b> : zone proche de développement. <b>Bruner</b> : étayage.",
  "<b>Cognitivisme</b> : mémoire à court terme limitée (7 ± 2), mémoire à long terme ; 4 facteurs d’efficacité : motivation, attention, compréhension, transfert."
 ],
 sets:[["i","Introduction"],["b","Béhaviorisme"],["k","Constructivisme et socioconstructivisme"],["g","Cognitivisme"],["c","Conférence d’introduction"]],
 fiches:[
  {t:"L’éducation dans l’Antiquité",tag:"introduction",b:`<ul><li><b>Athènes</b> : la <i>kalokagathia</i>, harmonie du beau et du bon ; éducation privée et payante ; grammatiste, cithariste, pédotribe.</li><li><b>Sparte</b> : l’efficacité guerrière ; l’<i>agogé</i>, publique et obligatoire, sous la direction du pédonome.</li><li><b>Rome</b> : l’efficacité civique et morale, le <i>mos maiorum</i> ; petites écoles privées du <i>ludi magister</i> ; Loi des Douze Tables apprise par cœur.</li><li>À 16 ans, toge virile et <b>tirocinium fori</b> : un an auprès d’un mentor au Forum ; puis <i>tirocinium militiae</i>.</li><li>Le <i>tutor</i> gère l’orphelin jusqu’à 25 ans ; le <i>susceptor</i> chrétien annonce le parrainage.</li></ul>`},
  {t:"Apprendre",tag:"définitions",b:`<ul><li><b>Aumont et Mesnier</b> (1992), trois modes d’appropriation : par conditionnement, par construction progressive, par traitement de l’information.</li><li><b>Reboul</b> : acquérir une information, un savoir-faire, une compréhension.</li><li><b>Vygotsky</b> : par les interactions sociales, dans une zone proximale de développement.</li><li><b>Meirieu</b> : attention à « l’activité pour l’activité » ; l’élève doit penser son travail. L’éducation à la liberté est une finalité de l’École.</li></ul>`},
  {t:"Les types de savoirs",tag:"introduction",b:`<ul><li><b>Formels</b> : structurés, intentionnels, institutionnels, sanctionnés par un diplôme.</li><li><b>Informels</b> : acquis au fil de l’eau, sans programme ni validation (Cristol et Muller).</li><li><b>Implicites</b> (tacites) : utilisés sans pouvoir les expliquer (grammaire « à l’oreille », équilibre à vélo).</li><li><b>Explicites</b> : conscients et verbalisables.</li><li><b>Expérientiels</b> : issus de l’action et du vécu (Kolb).</li><li><b>Profanes</b> : ceux des non-initiés, les « conceptions naïves » des élèves.</li><li>Matrice disciplinaire : Develay.</li></ul>`},
  {t:"Motivation et émotions",tag:"Viau",b:`<ul><li><b>Dynamique motivationnelle</b> de Roland Viau : l’élève s’implique selon…</li><li>l’<b>utilité</b> perçue de la tâche ;</li><li>le sentiment de <b>contrôlabilité</b> ;</li><li>sa croyance dans sa réussite ;</li><li>le <b>défi</b> : ni trop facile ni trop difficile ;</li><li>les croyances de l’enseignant ; les résultats obtenus.</li><li>Skinner : importance des feedbacks. Cognitivistes : une émotion positive consolide la trace en mémoire à long terme.</li><li>Le <b>système limbique</b> relie mémoire et émotions ; Olivier Houdé sur l’intelligence et les émotions.</li></ul>`},
  {t:"Enseigner",tag:"définitions",b:`<p class="q">« Teaching is not telling. »</p><ul><li>Conception <b>classique</b> : enseigner, c’est transmettre.</li><li>Conception <b>moderne</b> (Legendre, 1988) : « processus de communication en vue de susciter l’apprentissage ».</li><li>Enseigner, c’est <b>gérer des apprentissages</b> : provoquer, organiser, faciliter.</li><li>Comme vendre et acheter : sans apprentissage, pas d’enseignement digne de ce nom.</li><li>L’enseignant est un <b>organisateur de situations d’apprentissage</b>, un manager.</li><li>Triangle pédagogique de <b>Houssaye</b> (1988).</li></ul>`},
  {t:"Styles et stratégies d’enseignement",tag:"Therer et Willemart 1983",b:`<ul><li><b>Style</b> : manière personnelle d’organiser la relation enseignant-enseigné (Lewin, Lippitt et White, 1939).</li><li><b>Stratégie</b> : ensemble de comportements didactiques coordonnés (exposé, démonstration, débat).</li><li>Grille inspirée de Blake et Mouton (1964), deux axes : intérêt pour la <b>matière</b>, intérêt pour les <b>apprenants</b>.</li><li><b>Transmissif</b> (9.1) : centré sur la matière.</li><li><b>Incitatif</b> (9.9) : matière et apprenants.</li><li><b>Associatif</b> (1.9) : centré sur les apprenants.</li><li><b>Permissif</b> (1.1) : peu centré sur l’un comme sur l’autre.</li><li>Pas de « bon style » universel : l’enseignant efficace sait <b>varier</b>.</li></ul>`},
  {t:"Styles d’apprentissage et choix d’un style",tag:"Crahay 2016",b:`<ul><li>Style d’apprentissage : mode personnel de saisie et de traitement de l’information.</li><li><b>Style cognitif</b> : inné et stable · <b>style d’apprentissage</b> : inné et acquis, peut évoluer.</li><li>Pas de typologie rigide, pas de hiérarchie : il n’existe pas une bonne façon d’apprendre.</li><li>Quatre critères pour choisir : la <b>nature des objectifs</b>, la <b>motivation</b> des étudiants, leur <b>capacité</b>, leur <b>style d’apprentissage</b>.</li><li>Objectifs socio-affectifs de haut niveau : styles incitatif et associatif.</li><li>Étudiants moins performants : préfèrent d’abord un enseignement plus directif (Davies, 1971 ; Dupont, 1982).</li></ul>`},
  {t:"Naissance du béhaviorisme",tag:"Ribot · Watson",b:`<ul><li><b>Ribot</b> (1870) : une psychologie expérimentale, qui ne s’occupe ni de l’âme ni de son essence.</li><li>Avant : une psychologie d’<b>introspection</b>.</li><li>Vers 1910, <b>Watson</b> : n’étudier que les comportements observables (<i>behavior</i>).</li><li>Deux éléments vérifiables : le <b>stimulus</b> et la <b>réponse</b>.</li><li>Les béhavioristes imposent le mot « <b>apprentissage</b> » à la place de « mémoire ».</li><li>Apprendre : modifier systématiquement le comportement par l’exercice.</li></ul>`},
  {t:"Pavlov : le conditionnement classique",tag:"prix Nobel",b:`<ul><li>Découvert en étudiant la digestion du chien.</li><li><b>Stimulus inconditionnel</b> (viande) → réflexe inconditionnel (salivation).</li><li><b>Stimulus conditionnel</b> (cloche) associé à la viande → salivation à la cloche seule.</li><li>Un apprentissage « primitif », indépendant de la volonté.</li><li><b>Contiguïté temporelle</b> (le cours écrit « continuité ») : cloche et viande rapprochées.</li><li><b>Extinction</b> : sans récompense, la réponse disparaît.</li><li><b>Inhibition</b> : réponse bloquée par la frustration.</li><li><b>Récupération</b> : la réponse revient vite après un repos.</li><li><b>Généralisation</b> : la réponse s’étend à des stimuli ressemblants (le petit Albert, Watson et Rayner).</li></ul>`},
  {t:"Thorndike : les lois de l’apprentissage",tag:"1874-1949",b:`<ul><li>Premier à étudier l’apprentissage animal en laboratoire : les <b>boîtes à problèmes</b>.</li><li>Le chat affamé trouve le loquet par hasard, puis de plus en plus vite : <b>essai-erreur</b>.</li><li><b>Loi de l’exercice</b> : pour apprendre, il faut répéter.</li><li><b>Loi de l’effet</b> : une réponse suivie de satisfaction est renforcée ; suivie d’insatisfaction, affaiblie.</li><li>L’exercice n’aide que si la loi de l’effet peut jouer.</li></ul>`},
  {t:"Skinner : le conditionnement opérant",tag:"béhaviorisme",b:`<ul><li>L’animal apprend un comportement selon ses <b>conséquences</b> positives ou négatives.</li><li>Différence avec Pavlov : la <b>réponse elle-même</b> est conditionnelle (apprentissage instrumental).</li><li>L’apprentissage peut porter sur le délai ou le rythme des réponses.</li><li>Extinction et récupération spontanée, comme chez Pavlov.</li><li>Applications : <b>enseignement programmé</b> (petites étapes, rythme propre, premiers laboratoires de langues), thérapies comportementales.</li><li>1957 : le conditionnement opérant à l’origine de la communication humaine.</li></ul>`},
  {t:"L’impuissance apprise",tag:"Seligman 1971",b:`<ul><li>Expériences de <b>Seligman, Maier et Solomon</b> (1971) sur des chiens.</li><li>Un animal qui a subi des chocs sans pouvoir les éviter ne cherche plus à fuir, même quand c’est possible.</li><li>On conditionne à <b>subir</b>, non à réagir.</li><li>Chez l’élève : la <b>spirale de l’échec</b>, renoncer même quand on donne les moyens.</li><li>Bilan des conditionnements : beaucoup d’apprentissages sont <b>incidents</b> (non intentionnels), durables et réactivables.</li></ul>`},
  {t:"Le romantisme, ou pédagogie libertaire",tag:"Neill · Rogers",b:`<ul><li>En réaction aux méthodes de transmission : une éducation <b>centrée sur la personne</b>.</li><li><b>A. Neill</b> : l’école de <b>Summerhill</b> (Angleterre), autogestion.</li><li><b>Rogers, Maslow</b> : psychologie personnaliste, contre Freud et contre le béhaviorisme ; apprentissages significatifs.</li><li><b>Lewin</b> (1935) : le développement par le groupe.</li><li>Deux courants : l’<b>éducation non directive</b> (affectivité) et la <b>pédagogie interactionnelle</b> (créativité).</li></ul>`},
  {t:"Piaget : le constructivisme",tag:"équilibration",b:`<ul><li>La connaissance résulte d’une <b>construction mentale progressive</b>, en interaction avec l’environnement.</li><li><b>Assimilation</b> : intégrer l’objet nouveau aux <b>schèmes</b> existants.</li><li>Si cela résiste : déséquilibre, <b>conflit cognitif</b>.</li><li><b>Accommodation</b> : modifier ses schèmes, en créer un nouveau.</li><li><b>Équilibration majorante</b> : des paliers d’équilibre successifs, du sensorimoteur à l’opératoire.</li><li>Démarche <b>inductive</b> : des observations vers la théorie (les objets qui flottent).</li><li>Limite : le langage, l’affectif et le <b>milieu social</b> sont peu pris en compte.</li></ul>`},
  {t:"Vygotsky : le socioconstructivisme",tag:"Pensée et langage",b:`<p class="q">« Ce que l’enfant sait faire aujourd’hui en collaboration, il saura le faire tout seul demain. »</p><ul><li>Le développement va <b>du social à l’individuel</b>.</li><li>C’est l’<b>apprentissage qui tire le développement</b> (contre Piaget).</li><li><b>Zone proche de développement</b> : l’écart entre ce que l’enfant résout seul et ce qu’il résout avec de l’aide.</li><li>Calibrer la tâche dans cette zone : ni trop facile, ni trop difficile.</li><li>Rôle de la culture, de l’imitation, de la coopération ; peu favorable au cours magistral.</li><li>Gredler (1992) : quatre points communs entre Piaget et Vygotsky.</li><li>Les deux théories se complètent plus qu’elles ne s’opposent.</li></ul>`},
  {t:"Bruner : l’étayage",tag:"socioconstructivisme",b:`<ul><li><b>Étayage</b> : les interactions d’aide de l’adulte qui permettent à l’enfant de résoudre seul ce qu’il ne savait pas résoudre. Six fonctions.</li><li>Socio-affectif : <b>enrôler</b> dans la tâche, <b>maintenir l’orientation</b> et la motivation.</li><li>Cognitif : <b>alléger</b> la tâche, <b>signaler</b> les caractéristiques déterminantes, <b>montrer</b> sans donner la solution.</li><li>Trois modes de représentation : actif, iconique, symbolique.</li><li>Deux modes d’enseignement : par <b>exposition</b> (élève auditeur) ou <b>hypothétique</b> (coopération).</li><li>Trois processus : acquisition, transformation, évaluation.</li><li>Quatre techniques : contrastes, hypothèses, participation (jeu), conscience des stratégies.</li></ul>`},
  {t:"Les pédagogies actives",tag:"Vellas 2007",b:`<ul><li>Laisser agir : pédagogies libertaires.</li><li>Mettre en <b>projet</b> : Dewey.</li><li>Partir du besoin de jouer : <b>Claparède</b> ; de produire en travaillant : <b>Freinet</b>.</li><li>Un milieu et un matériel adaptés : <b>Montessori</b>.</li><li>Travail libre par groupes : <b>Cousinet</b>.</li><li>Réinventer les objets culturels : de <b>Decroly</b> au GFEN.</li><li>Aujourd’hui : pédagogies différenciées, situations-problèmes, démarches de recherche.</li></ul>`},
  {t:"Naissance du cognitivisme",tag:"Turing · Wiener",b:`<ul><li><b>Turing</b> : l’algorithme, bases de l’intelligence artificielle.</li><li><b>Wiener</b> (1948) : la cybernétique.</li><li><b>McCulloch et Pitts</b> : les neurones analysés comme des circuits logiques.</li><li>Penser, c’est <b>traiter de l’information</b> et manipuler des symboles.</li><li>La pensée humaine traite l’information <b>avant</b> de répondre : codage, stockage.</li><li>Contre Piaget : ce sont les <b>représentations</b> qui déterminent les traitements (et non les opérations).</li><li>Les <b>neurosciences</b> ne sont pas un courant théorique : elles complètent le cognitivisme.</li></ul>`},
  {t:"La mémoire",tag:"Gagné",b:`<ul><li>Trois registres sensoriels : visuel, auditif, tactile.</li><li><b>Mémoire à court terme</b> : traitement conscient ; capacité de <b>7 ± 2</b> éléments ; quelques dizaines de secondes.</li><li>L’<b>attention</b> agit comme un entonnoir, un filtre.</li><li><b>Mémoire à long terme</b> : stockage permanent ; oublier, c’est ne plus trouver les bons indices.</li><li><b>Épisodique</b> : souvenirs personnels, contexte, émotion, images.</li><li><b>Sémantique</b> : connaissances générales, <b>déclaratives</b> (savoir quoi) et <b>procédurales</b> (savoir-faire).</li><li><b>Gagné</b> : apprendre, c’est intégrer de nouvelles informations en mémoire à long terme.</li></ul>`},
  {t:"Guider la mémoire",tag:"Ausubel · Tardif · Barsalou",b:`<ul><li><b>Ausubel</b> (1960) : les <i>advance organizers</i>, ou <b>indices préalables de structuration</b>, orientent la perception.</li><li>Bloom : la qualité des indices expliquerait 14 % des gains d’apprentissage.</li><li>Ne pas confondre : intégrer aux <b>connaissances antérieures</b> (mémoire sémantique) et enraciner dans le <b>vécu</b> (mémoire épisodique).</li><li><b>Tardif</b> (1992) : l’école vise surtout la mémoire sémantique, plus générale.</li><li>Bachelard : rupture entre représentations spontanées et concepts scientifiques.</li><li><b>Barsalou</b> (2010) : modèle connexionniste, l’exemple du vélo ; les propriétés d’un objet sont stockées en réseau.</li></ul>`},
  {t:"Les 4 facteurs d’efficacité",tag:"Rossi 2014",b:`<ul><li>Trois catégories de conditions : facteurs généraux, procédures et modalités, traitement des réponses.</li><li><b>Motivation</b> : plus de vigilance, d’activité, de persévérance, de temps (Maslow, 1943).</li><li><b>Attention</b> : identifier ce qu’il faut apprendre, puis focaliser dessus.</li><li><b>Compréhension</b>, quatre niveaux : saisir le sens · identifier les causes · mesurer la portée · savoir ce qu’il faut pour résoudre.</li><li>Comprendre structure l’information et crée des <b>indices de récupération</b> : verbaux, iconiques, thématiques, phonologiques.</li><li><b>Transfert</b> : finalité de tout apprentissage.</li></ul>`},
  {t:"Le transfert des apprentissages",tag:"Samson",b:`<ul><li><b>Application</b> : réutiliser dans un contexte identique (Désilets, 1997).</li><li><b>Généralisation</b> : s’appuyer sur les ressemblances entre deux situations.</li><li><b>Transfert</b> : utiliser un savoir dans une situation jamais rencontrée.</li><li>Les exercices répétitifs sont des applications, pas des transferts.</li><li>Pour le favoriser : activer les acquis, <b>catégoriser</b> (réseaux de concepts), situations proches des élèves, puis variées et complexes.</li><li>Apprentissage <b>distribué</b> dans le temps.</li></ul>`},
  {t:"Les 4 piliers de l’apprentissage",tag:"Dehaene revu par Segond",b:`<ul><li>Les piliers de Dehaene : attention, engagement actif, retour d’information, consolidation.</li><li>Lecture du syllabus (2019), un pilier par style d’enseignement :</li><li><b>Créativité</b> ↔ style <b>permissif</b> : attention, implication.</li><li><b>Confiance en soi</b> ↔ style <b>incitatif</b> : engagement actif, métacognition.</li><li><b>Besoins physiologiques</b> ↔ style <b>transmissif</b> : outils structurés, répétition, consolidation.</li><li><b>Résilience</b> ↔ style <b>associatif</b> : erreur, retour d’information.</li></ul>`}
 ],
