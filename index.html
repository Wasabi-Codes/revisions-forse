function tabsFor(m){
  const t=[["ess","L’essentiel"],["fiches","Fiches"]];
  if(m.conf)t.push(["conf","Conférences"]);
  if(m.check)t.push(["check","Mon dossier"]);
  if(m.frise)t.push(["frise","Frise"]);
  if(m.compare||m.three)t.push(["cmp","Comparer"]);
  if(m.flash.length)t.push(["flash","Flashcards"]);
  if(m.quiz.length)t.push(["quiz","Quiz"]);
  if(m.cit&&m.cit.length)t.push(["cit","Citations"]);
  if(m.sujets)t.push(["suj","Sujets"]);
  if(m.media)t.push(["media","Vidéos"]);
  return t;
}
function setTab(t){view.tab=t;renderM();window.scrollTo({top:0})}
function renderM(){
  const id=view.m,m=M[id];
  topbar.innerHTML=`<button class="back" id="back" aria-label="Retour aux matières">← Matières</button><div class="sp"></div><span class="meta epm">${m.ep}</span>${themeBtn()}`;
  $("#back").onclick=()=>go("home");
  const tabs=tabsFor(m); if(!tabs.find(t=>t[0]===view.tab))view.tab="ess";
  const pr=progress(id),u=unreadConf(id);
  app.innerHTML=`<div class="mc" data-m="${id}">
   <section class="mhead"><div class="mhl"><span class="ue">${m.ects}</span><h1>${m.nom}</h1>
    <div class="chips"><span class="chip c">${m.ep}</span><span class="chip">${m.fiches.length+(m.conf||[]).length} fiches</span>${m.flash.length?`<span class="chip">${m.flash.length} flashcards</span>`:""}${m.quiz.length?`<span class="chip">${m.quiz.length} questions</span>`:""}${m.check?`<span class="chip">${m.check.length} étapes</span>`:""}</div></div>
    <div class="gring sm">${ring(pr,64,7)}<span><b>${pr}%</b></span></div></section>
   ${PDF[id]?`<div class="pdfs top">${PDF[id].map(p=>`<a class="pdf" href="${p[3]?`https://drive.google.com/file/d/${p[3]}/view`:encodeURI(PDFDIR+p[1])}" target="_blank" rel="noopener"><span class="pico">PDF</span><span><b>${p[0]}</b><small>Ouvrir le cours remis en page · ${p[2]}</small></span><i>↗</i></a>`).join("")}</div>`:""}
   <nav class="tabs" role="tablist">${tabs.map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="${t[0]===view.tab}">${t[1]}${t[0]==="conf"&&u?`<i class="dotn">${u}</i>`:""}${t[0]==="fiches"&&m.isNew&&unreadF(id)?`<i class="dotn">${unreadF(id)}</i>`:""}</button>`).join("")}</nav>
   <div class="pane" id="pane"></div></div>`;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  const sel=app.querySelector('.tab[aria-selected="true"]'); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
  ({ess:paneEss,fiches:(a,b,c)=>paneFiches(a,b,c,"f"),conf:(a,b,c)=>paneFiches(a,b,c,"k"),check:paneCheck,frise:paneFrise,cmp:paneCmp,flash:paneFlash,quiz:paneQuiz,cit:paneCit,suj:paneSuj,media:paneMedia})[view.tab](id,m,$("#pane"));
}

function paneEss(id,m,el){
  el.innerHTML=`<div class="fil"><span class="eyebrow">Le fil rouge</span>${m.fil}</div>
   ${m.exam?`<div class="exam"><span class="eyebrow">L’épreuve annoncée</span><h3>${m.exam.f}</h3><ul>${m.exam.pts.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
   <h2 class="h2">${m.keys.length} idées à retenir</h2><div class="keys">${m.keys.map(k=>`<div class="key"><div>${k}</div></div>`).join("")}</div>
   <h2 class="h2">Plan du cours</h2><div class="plancours">${m.plan.map(p=>`<span>${p}</span>`).join("")}</div>
   <div class="row" style="margin-top:6px"><button class="btn pri grow" data-t="${m.conf&&unreadConf(id)?"conf":"fiches"}">${m.conf&&unreadConf(id)?"Lire les fiches de conférences":"Lire les fiches"}</button><button class="btn grow" data-t="${m.quiz.length?"quiz":"check"}">${m.quiz.length?"S’entraîner au quiz":"Suivre mon dossier"}</button></div>`;
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
}

function paneFiches(id,m,el,p){
  const list=p==="f"?m.fiches:m.conf, cnt=()=>list.filter((_,j)=>has(`${p}:${id}:${j}`)).length;
  const lab=()=>`${cnt()} / ${list.length} fiches lues`;
  el.innerHTML=`${p==="k"?audioHTML(id):""}<div class="filter"><span class="meta">${lab()}</span>${p==="k"?`<span class="meta">· Ce qui a été dit en conférence et en webinaire, en plus du cours</span>`:""}</div>`+list.map((f,i)=>{const d=has(`${p}:${id}:${i}`);return `
   <article class="fiche${d?" done":""}" data-i="${i}"><button aria-expanded="false"><span class="dot" aria-hidden="true">✓</span><h3>${f.t}</h3><span class="tag">${f.tag}</span><span class="chev" aria-hidden="true">▾</span></button>
   <div class="fbody" hidden>${(f.img||[]).map(figHTML).join("")}${f.b}<button class="mark">${d?"Marquer comme non lue":"J’ai compris cette fiche ✓"}</button></div></article>`}).join("");
  el.querySelectorAll(".fiche").forEach(a=>{
    const i=+a.dataset.i, b=a.querySelector("button"), body=a.querySelector(".fbody");
    b.onclick=()=>{const o=body.hidden;body.hidden=!o;a.classList.toggle("open",o);b.setAttribute("aria-expanded",o)};
    a.querySelector(".mark").onclick=()=>{const k=`${p}:${id}:${i}`;flag(k,!has(k));const d=has(k);a.classList.toggle("done",d);a.querySelector(".mark").textContent=d?"Marquer comme non lue":"J’ai compris cette fiche ✓";el.querySelector(".filter .meta").textContent=lab();
      if(d){body.hidden=true;a.classList.remove("open");const nx=a.nextElementSibling;if(nx&&nx.classList.contains("fiche")){nx.querySelector("button").click();nx.scrollIntoView({behavior:"smooth",block:"center"})}}};
  });
}

function paneCheck(id,m,el){
  const draw=()=>{const n=m.check.filter((_,i)=>has(`h:${id}:${i}`)).length;
   el.innerHTML=`<div class="exam"><span class="eyebrow">Avancement du dossier</span><h3>${n} / ${m.check.length} étapes</h3><div class="bar"><i style="width:${n/m.check.length*100}%"></i></div></div>
   <div class="checks">${m.check.map((c,i)=>`<label class="check${has(`h:${id}:${i}`)?" on":""}"><input type="checkbox" data-i="${i}" ${has(`h:${id}:${i}`)?"checked":""}><span>${c}</span></label>`).join("")}</div>`;
   el.querySelectorAll("input").forEach(x=>x.onchange=()=>{flag(`h:${id}:${x.dataset.i}`,x.checked);draw()})};
  draw();
}

function paneFrise(id,m,el){
  let f="all";
  const draw=()=>{el.innerHTML=`<div class="seg">${[["all","Tout"],...m.frise.map((p,i)=>[String(i),p[0]])].map(([k,l])=>`<button aria-pressed="${f===k}" data-f="${k}">${l}</button>`).join("")}</div>
   ${m.friseImg?figHTML(m.friseImg):""}<div class="frise">${m.frise.map((p,i)=>(f==="all"||f===String(i))?`<div class="per">${p[0]}</div>`+p[1].map(e=>`<div class="ev"><div class="y">${e[0]}</div><div class="l">${e[1]}</div><div class="x">${e[2]}</div></div>`).join(""):"").join("")}</div>
   <div class="row"><button class="btn" id="hide">Masquer les explications</button></div>`;
   el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;draw()});
   $("#hide").onclick=e=>{const on=el.querySelector(".frise").classList.toggle("quizmode");e.target.textContent=on?"Afficher les explications":"Masquer les explications"};
   el.querySelectorAll(".ev").forEach(v=>v.onclick=()=>v.classList.toggle("show"))};
  draw();
}

function paneCmp(id,m,el){
  if(m.compare){
    el.innerHTML=`<h2 class="h2">${m.compare.titre}</h2><div class="cmp">${m.compare.items.map(it=>`<div class="cmpcard"><h3>${it.n}</h3><dl>${it.d.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>`).join("")}</div>`;
    return;
  }
  let d=0;
  const draw=()=>{el.innerHTML=`<h2 class="h2">Les trois pédagogues, dimension par dimension</h2><div class="seg">${m.three.dims.map((x,i)=>`<button aria-pressed="${i===d}" data-d="${i}">${x}</button>`).join("")}</div>
   <div class="three">${m.three.items.map(it=>`<div class="cmpcard"><span class="who">${m.three.dims[d]}</span><h3>${it.n}</h3><div>${it.d[d]}</div></div>`).join("")}</div>`;
   el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{d=+b.dataset.d;draw()})};
  draw();
}

function paneFlash(id,m,el){
  const st=fcState[id]||(fcState[id]={only:false,order:m.flash.map((_,i)=>i),pos:0,flip:false});
  const deck=()=>st.order.filter(i=>!st.only||!has(`c:${id}:${i}`));
  const draw=()=>{
    const d=deck(); const known=m.flash.filter((_,i)=>has(`c:${id}:${i}`)).length;
    if(!d.length){el.innerHTML=`<div class="empty"><span class="eyebrow">Bravo</span><p style="margin:0">Tu connais les ${m.flash.length} cartes de cette matière.</p><div class="row"><button class="btn pri" id="all">Tout revoir</button></div></div>`;$("#all").onclick=()=>{st.only=false;st.pos=0;draw()};return}
    if(st.pos>=d.length)st.pos=0;
    const i=d[st.pos],c=m.flash[i];
    el.innerHTML=`<div class="row" style="justify-content:space-between"><span class="meta">Carte ${st.pos+1} / ${d.length} · ${known} sues</span><label class="toggle"><input type="checkbox" id="only" ${st.only?"checked":""}> Seulement à revoir</label></div>
     <div class="qprog"><i style="width:${known/m.flash.length*100}%"></i></div>
     <div class="flash"><button class="card${st.flip?" flip":""}" id="card" aria-label="Retourner la carte"><div class="face"><span class="eyebrow">Question${c[2]?" · nouveau":""}</span><div class="txt">${c[0]}</div><span class="hint">Touche pour voir la réponse</span></div><div class="face back"><span class="eyebrow">Réponse</span><div class="txt">${c[1]}</div></div></button></div>
     <div class="row"><button class="btn bad grow" id="no">À revoir</button><button class="btn good grow" id="yes">Je sais ✓</button></div>
     <div class="row"><button class="btn" id="prev" aria-label="Carte précédente">←</button><button class="btn grow" id="shuf">Mélanger</button><button class="btn" id="next" aria-label="Carte suivante">→</button></div>`;
    $("#card").onclick=()=>{st.flip=!st.flip;$("#card").classList.toggle("flip",st.flip)};
    const nxt=()=>{st.flip=false;st.pos=(st.pos+1)%Math.max(1,deck().length);draw()};
    $("#yes").onclick=()=>{flag(`c:${id}:${i}`,1);if(st.only){st.flip=false;draw()}else nxt()};
    $("#no").onclick=()=>{flag(`c:${id}:${i}`,0);nxt()};
    $("#next").onclick=nxt;
    $("#prev").onclick=()=>{st.flip=false;st.pos=(st.pos-1+d.length)%d.length;draw()};
    $("#shuf").onclick=()=>{st.order=shuffled(st.order);st.pos=0;st.flip=false;draw()};
    $("#only").onchange=e=>{st.only=e.target.checked;st.pos=0;st.flip=false;draw()};
  };
  draw();
}

/* ============ MOTEUR DE QUIZ ============ */
function runQuiz(el,items,o){
  const st={k:0,score:0,ans:null,ord:null,miss:[]}, n=items.length;
  const draw=()=>{
    if(st.k>=n){
      if(o.done)o.done(st.score,n);
      const pc=st.score/n;
      el.innerHTML=`<div class="qbox result"><span class="eyebrow">${o.title}</span><div class="scorewrap" style="--c:${pc>=.7?"var(--good)":"var(--c,var(--accent))"}">${ring(Math.round(pc*100),120,11)}<div class="score">${st.score}<small>/${n}</small></div></div>
       <p class="msg">${pc===1?"Sans faute.":pc>=.7?"Solide. Reprends seulement les questions ratées.":"À retravailler : les erreurs sont mises de côté pour toi."}</p>
       ${st.miss.length?`<div class="review"><span class="eyebrow">À revoir</span>${st.miss.map(x=>{const q=M[x.id].quiz[x.i];return `<div class="rv"><b>${q.q}</b><span>${q.o[q.a]}</span><small>${q.e}</small></div>`}).join("")}</div>`:""}
       <div class="row"><button class="btn pri grow" id="again">Recommencer</button><button class="btn grow" id="qback">${o.backLabel||"Retour"}</button></div></div>`;
      $("#again").onclick=()=>o.again();$("#qback").onclick=()=>o.back();window.scrollTo({top:0});return;
    }
    const it=items[st.k], q=M[it.id].quiz[it.i];
    if(!st.ord)st.ord=shuffled(q.o.map((_,j)=>j));
    el.innerHTML=`<div class="qprog"><i style="width:${st.k/n*100}%"></i></div>
     <div class="qbox mc" ${o.mixed?`data-m="${it.id}"`:""}><div class="row" style="justify-content:space-between"><span class="meta">Question ${st.k+1} / ${n}</span><span class="meta">${o.mixed?`<span class="chip c">${SH[it.id]}</span> `:""}Score ${st.score}</span></div><h3>${q.q}</h3>
     <div class="opts">${st.ord.map((j,k)=>`<button class="opt" data-j="${j}"><b>${"ABCD"[k]}</b><span>${q.o[j]}</span></button>`).join("")}</div>
     <div id="fb"></div></div><button class="reveal quit" id="quit">Quitter la série</button>`;
    const fb=$("#fb");$("#quit").onclick=()=>o.back();
    const show=()=>{el.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.j;b.disabled=true;if(j===q.a)b.classList.add("ok");else if(j===st.ans)b.classList.add("ko")});
      fb.innerHTML=`<div class="expl ${st.ans===q.a?"good":"bad"}">${st.ans===q.a?"<b>Juste.</b> ":"<b>Pas tout à fait.</b> "}${q.e}</div><div class="row" style="margin-top:10px"><button class="btn pri grow" id="nq">${st.k+1<n?"Question suivante":"Voir le résultat"}</button></div>`;
      $("#nq").onclick=()=>{st.k++;st.ans=null;st.ord=null;draw()};$("#nq").focus({preventScroll:true})};
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(st.ans!==null)return;st.ans=+b.dataset.j;
      if(st.ans===q.a){st.score++;S[`r:${it.id}:${it.i}`]=1;delete S[`x:${it.id}:${it.i}`]}else{S[`x:${it.id}:${it.i}`]=1;st.miss.push(it)}save();renderNav();show()});
  };
  draw();
}
function setsOf(m){return (m.sets||[["","Le cours"],["c","Conférences et webinaires"]]).filter(s=>m.quiz.some(q=>(q.s||"")===s[0]))}
function paneQuiz(id,m,el){
  const menu=()=>{
    const wr=wrongOf(id), right=qRight(id);
    el.innerHTML=`<div class="exam"><span class="eyebrow">Banque de questions</span><h3>${right} / ${m.quiz.length} déjà réussies</h3><div class="bar"><i style="width:${right/m.quiz.length*100}%"></i></div></div>
     <div class="sets">${setsOf(m).map(s=>{const n=m.quiz.filter(q=>(q.s||"")===s[0]).length,b=S[`q:${id}:${s[0]}`];return `<button class="setcard" data-s="${s[0]}"><b>${s[1]}${b===undefined&&(s[0]==="c"||m.isNew)?` <em class="new">À faire</em>`:""}</b><small>${n} questions${b!==undefined?` · meilleur score ${b}/${n}`:""}</small><i>→</i></button>`}).join("")}
      <button class="setcard" data-s="*"><b>Série express</b><small>10 questions au hasard dans toute la matière</small><i>→</i></button>
      ${wr.length?`<button class="setcard warn" data-s="!"><b>À retravailler</b><small>${wr.length} question${wr.length>1?"s":""} ratée${wr.length>1?"s":""} à reprendre</small><i>→</i></button>`:""}
     </div><p class="meta">L’ordre des réponses change à chaque passage. Une question ratée revient dans « À retravailler » jusqu’à ce que tu la réussisses.</p>`;
    el.querySelectorAll(".setcard").forEach(b=>b.onclick=()=>start(b.dataset.s));
  };
  const start=s=>{
    let idx=m.quiz.map((_,i)=>i), title="";
    if(s==="*"){idx=shuffled(idx).slice(0,10);title="Série express"}
    else if(s==="!"){idx=shuffled(wrongOf(id));title="À retravailler"}
    else{idx=idx.filter(i=>(m.quiz[i].s||"")===s);title=(setsOf(m).find(x=>x[0]===s)||["",""])[1]}
    if(!idx.length){menu();return}
    runQuiz(el,idx.map(i=>({id,i})),{title,back:menu,again:()=>start(s),backLabel:"Choisir une autre série",
      done:(sc,n)=>{if(s!=="*"&&s!=="!"){const k=`q:${id}:${s}`;if(S[k]===undefined||sc>S[k]){S[k]=sc;save()}}}});
    window.scrollTo({top:0});
  };
  menu();
}

function paneCit(id,m,el){
  el.innerHTML=`<p class="meta">Devine l’auteur, puis vérifie. Une citation bien placée vaut mieux que trois mal recopiées.</p>`+m.cit.map((c,i)=>`<div class="quote"><blockquote>${c[0]}</blockquote><button class="reveal" data-i="${i}">Qui ? Pour quoi faire ?</button><div class="ans" hidden><b>${c[1]}</b><br>${c[2]}</div></div>`).join("");
  el.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>{const a=b.nextElementSibling;a.hidden=!a.hidden;b.textContent=a.hidden?"Qui ? Pour quoi faire ?":"Masquer"});
}

function paneSuj(id,m,el){
  let n=0;
  el.innerHTML=`<p class="meta">Entraîne-toi : lis le sujet, cherche ta réponse en 10 minutes, puis compare. Ce sont des entraînements, pas des sujets annoncés.</p>`+m.sujets.map(s=>{const l=s.cas?"Voir des éléments de réponse":"Voir un plan possible";return `<div class="sujet"><span class="eyebrow">${s.cas?"Étude de cas":"Sujet "+(++n)}${s.n?` <em class="new">Nouveau</em>`:""}</span><h3>${s.t}</h3><button class="reveal" data-l="${l}">${l}</button><div hidden><p style="margin:0 0 8px"><i>${s.p}</i></p><ol>${s.parts.map(p=>`<li>${p}</li>`).join("")}</ol></div></div>`}).join("");
  el.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>{const a=b.nextElementSibling;a.hidden=!a.hidden;b.textContent=a.hidden?b.dataset.l:"Masquer"});
}

/* ============ À RETRAVAILLER ============ */
function head(t,sub){return `<section class="mhead"><div class="mhl"><span class="ue">${sub}</span><h1>${t}</h1></div></section>`}
function renderRedo(){
  topbar.innerHTML=`<div class="brand">À retravailler<small>Tes erreurs, mises de côté</small></div><div class="sp"></div>${themeBtn()}`;
  const draw=()=>{
    const all=allWrong();
    if(!all.length){app.innerHTML=`<div class="mc" style="--c:var(--c-socio)">${head("À retravailler","Reprise des erreurs")}<div class="empty"><span class="eyebrow">Rien en attente</span><p style="margin:0">Chaque question ratée dans un quiz arrive ici. Elle en sort dès que tu la réussis.</p><div class="row"><button class="btn pri" id="gomix">Lancer un quiz mélangé</button></div></div></div>`;$("#gomix").onclick=()=>go("mix");return}
    app.innerHTML=`<div class="mc" style="--c:var(--c-socio)">${head("À retravailler","Reprise des erreurs")}
      <div class="exam"><span class="eyebrow">En attente</span><h3>${all.length} question${all.length>1?"s":""} à reprendre</h3></div>
      <div class="sets">${ORDER.filter(id=>wrongOf(id).length).map(id=>`<button class="setcard mc" data-m="${id}" data-id="${id}"><b>${M[id].nom}</b><small>${wrongOf(id).length} question${wrongOf(id).length>1?"s":""}</small><i>→</i></button>`).join("")}
      <button class="setcard warn" data-id="*"><b>Tout reprendre</b><small>${Math.min(20,all.length)} questions, toutes matières</small><i>→</i></button></div>
      <div id="pane" class="pane"></div></div>`;
    app.querySelectorAll(".setcard").forEach(b=>b.onclick=()=>{const id=b.dataset.id;const items=id==="*"?shuffled(all).slice(0,20):shuffled(wrongOf(id)).map(i=>({id,i}));
      app.querySelector(".sets").hidden=true;app.querySelector(".exam").hidden=true;
      runQuiz($("#pane"),items,{title:"À retravailler",mixed:true,back:draw,again:draw,backLabel:"Voir ce qu’il reste"});window.scrollTo({top:0})});
  };
  draw();
}

/* ============ QUIZ MÉLANGÉ ============ */
function renderMix(){
  topbar.innerHTML=`<div class="brand">Quiz mélangé<small>Toutes les matières</small></div><div class="sp"></div>${themeBtn()}`;
  const draw=()=>{
    const on=QIDS().filter(id=>!mixSt.off[id]), tot=on.reduce((s,id)=>s+M[id].quiz.length,0);
    app.innerHTML=`<div class="mc" style="--c:var(--c-inst)">${head("Quiz mélangé","Entraînement")}
     <h2 class="h2">Matières</h2><div class="seg">${QIDS().map(id=>`<button aria-pressed="${!mixSt.off[id]}" data-id="${id}">${SH[id]}</button>`).join("")}</div>
     <h2 class="h2">Longueur</h2><div class="seg">${[10,20,30].map(n=>`<button aria-pressed="${mixSt.len===n}" data-n="${n}">${n} questions</button>`).join("")}</div>
     <label class="toggle" style="margin-top:4px"><input type="checkbox" id="newonly" ${mixSt.fresh?"checked":""}> Priorité aux questions jamais réussies</label>
     <div class="row"><button class="btn pri grow" id="startmix" ${tot?"":"disabled"}>Lancer · ${Math.min(mixSt.len,tot)} questions sur ${tot}</button></div>
     <div id="pane" class="pane"></div></div>`;
    app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{mixSt.off[b.dataset.id]=!mixSt.off[b.dataset.id];draw()});
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{mixSt.len=+b.dataset.n;draw()});
    $("#newonly").onchange=e=>{mixSt.fresh=e.target.checked};
    $("#startmix").onclick=()=>{let pool=[];on.forEach(id=>M[id].quiz.forEach((_,i)=>pool.push({id,i})));pool=shuffled(pool);
      if(mixSt.fresh)pool.sort((a,b)=>has(`r:${a.id}:${a.i}`)-has(`r:${b.id}:${b.i}`));
      const items=shuffled(pool.slice(0,mixSt.len));
      app.querySelector(".mc").innerHTML=`<div id="pane" class="pane" style="padding-top:18px"></div>`;
      runQuiz($("#pane"),items,{title:"Quiz mélangé",mixed:true,back:draw,again:draw,backLabel:"Nouveau quiz"});window.scrollTo({top:0})};
  };
  draw();
}

/* ============ MÉMO NOMS ET DATES ============ */
function renderMemo(){
  topbar.innerHTML=`<div class="brand">Mémo noms et dates<small>Auteurs, œuvres, repères</small></div><div class="sp"></div>${themeBtn()}`;
  const ids=()=>memoSt.sub==="all"?Object.keys(MEMO):[memoSt.sub];
  const facts=e=>`<b>${e.n}</b> · ${e.r}${e.yl?` · <b>${e.yl}</b>`:""}`;
  const subs=()=>`<div class="seg">${[["all","Toutes"],...Object.keys(MEMO).map(id=>[id,SH[id]])].map(([k,l])=>`<button aria-pressed="${memoSt.sub===k}" data-sub="${k}">${l}</button>`).join("")}</div>`;
  const menu=()=>{
    const pool=memoAll(ids()), ok=pool.filter(e=>mlv(e)>=2).length;
    app.innerHTML=`<div class="mc" style="--c:var(--c-hist)">${head("Mémo noms et dates","Entraînement ciblé")}
     ${subs()}
     <div class="exam"><span class="eyebrow">Repères maîtrisés</span><h3>${ok} / ${pool.length}</h3><div class="bar"><i style="width:${pool.length?ok/pool.length*100:0}%"></i></div>
      <div class="lvl">${[0,1,2,3].map(l=>`<span><i class="lv l${l}"></i>${pool.filter(e=>mlv(e)===l).length} ${["à apprendre","vu une fois","acquis","solide"][l]}</span>`).join("")}</div></div>
     <div class="sets">
      <button class="setcard" data-g="mix"><b>Série de 10</b><small>Qui ? Quand ? Dans l’ordre, par paires : les repères ratés reviennent plus souvent</small><i>→</i></button>
      <button class="setcard" data-g="qui"><b>Qui ?</b><small>Retrouver l’auteur d’une notion ou d’une œuvre</small><i>→</i></button>
      <button class="setcard" data-g="quand"><b>Quand ?</b><small>Retrouver la date</small><i>→</i></button>
      <button class="setcard" data-g="ordre"><b>Dans l’ordre</b><small>Remettre quatre repères en ordre chronologique</small><i>→</i></button>
      <button class="setcard" data-g="paires"><b>Par paires</b><small>Associer chaque nom à son repère</small><i>→</i></button>
      <button class="setcard" data-g="list"><b>Répertoire</b><small>Tous les noms et dates, avec recherche</small><i>→</i></button>
     </div></div>`;
    app.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{memoSt.sub=b.dataset.sub;menu()});
    app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>b.dataset.g==="list"?list():play(b.dataset.g));
  };
  const list=()=>{
    let q="";
    app.innerHTML=`<div class="mc" style="--c:var(--c-hist)">${head("Répertoire","Mémo noms et dates")}${subs()}
      <input class="search" id="q" type="search" placeholder="Chercher un nom, une notion, une date" aria-label="Chercher dans le répertoire"><div id="rows" class="rows"></div>
      <div class="row"><button class="btn" id="mback">← Retour au Mémo</button></div></div>`;
    const rows=()=>{const pool=memoAll(ids()).filter(e=>!q||(e.n+" "+e.r+" "+e.yl).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(q)).sort((a,b)=>a.n.localeCompare(b.n,"fr"));
      $("#rows").innerHTML=pool.length?pool.map(e=>`<div class="rowm mc" data-m="${e.id}"><i class="lv l${mlv(e)}"></i><div><b>${e.n}</b><span>${e.r}</span>${e.tip?`<small>Astuce : ${e.tip}</small>`:""}</div>${e.yl?`<em>${e.yl}</em>`:""}</div>`).join(""):`<p class="meta">Aucun repère trouvé.</p>`};
    rows();$("#q").oninput=e=>{q=e.target.value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();rows()};
    app.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{memoSt.sub=b.dataset.sub;list()});
    $("#mback").onclick=menu;
  };
  const play=mode=>{
    const pool=memoAll(ids()), dated=pool.filter(e=>e.y!=null);
    const st={k:0,n:10,score:0,miss:[],recent:[]};
    const weighted=src=>{const c=src.filter(e=>!st.recent.includes(e.id+e.i));const a=c.length?c:src;let tot=0;const w=a.map(e=>{const x=Math.pow(4-mlv(e),2);tot+=x;return x});let r=Math.random()*tot;for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}return a[a.length-1]};
    const uniq=(arr,key)=>{const s=new Set(),o=[];arr.forEach(e=>{const v=key(e);if(!s.has(v)){s.add(v);o.push(e)}});return o};
    const sameSub=(e,src)=>{const a=src.filter(x=>x.id===e.id);return a.length>=6?a:src};
    const types=()=>{const t=[];if(mode!=="mix")return [mode];t.push("qui","qui","qui","paires");if(dated.length>=4)t.push("quand","quand","ordre");return t};
    const frame=(label,inner)=>`<div class="qprog"><i style="width:${st.k/st.n*100}%"></i></div><div class="qbox"><div class="row" style="justify-content:space-between"><span class="meta">${label} · ${st.k+1} / ${st.n}</span><span class="meta">Score ${st.score}</span></div>${inner}<div id="fb"></div></div><button class="reveal quit" id="quit">Quitter la série</button>`;
    const after=(ok,items,html)=>{items.forEach(([e,g])=>{setLv(e,g);if(!g&&!st.miss.includes(e))st.miss.push(e)});if(ok)st.score++;
      $("#fb").innerHTML=`<div class="expl ${ok?"good":"bad"}">${ok?"<b>Juste.</b> ":"<b>À revoir.</b> "}${html}</div><div class="row" style="margin-top:10px"><button class="btn pri grow" id="nq">${st.k+1<st.n?"Suivant":"Voir le résultat"}</button></div>`;
      $("#nq").onclick=()=>{st.k++;round()};$("#nq").focus({preventScroll:true})};
    const round=()=>{
      const pane=$("#pane");
      if(st.k>=st.n){const pc=st.score/st.n;pane.innerHTML=`<div class="qbox result"><span class="eyebrow">Mémo noms et dates</span><div class="scorewrap" style="--c:${pc>=.7?"var(--good)":"var(--c)"}">${ring(Math.round(pc*100),120,11)}<div class="score">${st.score}<small>/${st.n}</small></div></div>
        <p class="msg">${pc===1?"Sans faute.":pc>=.7?"Bien. Les repères ratés reviendront plus souvent.":"Normal au début : refais une série, les mêmes repères vont revenir."}</p>
        ${st.miss.length?`<div class="review"><span class="eyebrow">À retenir</span>${st.miss.map(e=>`<div class="rv"><span>${facts(e)}</span>${e.tip?`<small>Astuce : ${e.tip}</small>`:""}</div>`).join("")}</div>`:""}
        <div class="row"><button class="btn pri grow" id="again">Nouvelle série</button><button class="btn grow" id="qback">Retour au Mémo</button></div></div>`;
        $("#again").onclick=()=>play(mode);$("#qback").onclick=menu;window.scrollTo({top:0});return}
      let ty=pick(types());
      if((ty==="quand"||ty==="ordre")&&dated.length<4)ty="qui";
      if(ty==="qui"){
        const e=weighted(pool);st.recent=[e.id+e.i,...st.recent].slice(0,6);
        const others=shuffled(uniq(sameSub(e,pool).filter(x=>x.n!==e.n&&x.r!==e.r),x=>x.n)).slice(0,3);
        const opts=shuffled([e,...others]);
        pane.innerHTML=frame("Qui ?",`<h3>${e.r}${e.yl?` <span class="yr">${e.yl}</span>`:""}</h3><div class="opts">${opts.map((x,k)=>`<button class="opt" data-n="${esc(x.n)}"><b>${"ABCD"[k]}</b><span>${x.n}</span></button>`).join("")}</div>`);
        pane.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(pane.querySelector(".opt[disabled]"))return;const ok=b.dataset.n===e.n;pane.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.n===e.n)x.classList.add("ok");else if(x===b)x.classList.add("ko")});after(ok,[[e,ok]],facts(e)+(e.tip?`<br><small>Astuce : ${e.tip}</small>`:""))});
      }else if(ty==="quand"){
        const e=weighted(dated);st.recent=[e.id+e.i,...st.recent].slice(0,6);
        const near=uniq(sameSub(e,dated).filter(x=>x.yl!==e.yl),x=>x.yl).sort((a,b)=>Math.abs(a.y-e.y)-Math.abs(b.y-e.y)).slice(0,6);
        const opts=shuffled([e,...shuffled(near).slice(0,3)]).sort((a,b)=>a.y-b.y);
        pane.innerHTML=frame("Quand ?",`<h3>${e.n}<span class="sub">${e.r}</span></h3><div class="opts two">${opts.map(x=>`<button class="opt" data-y="${esc(x.yl)}"><span>${x.yl}</span></button>`).join("")}</div>`);
        pane.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(pane.querySelector(".opt[disabled]"))return;const ok=b.dataset.y===e.yl;pane.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.y===e.yl)x.classList.add("ok");else if(x===b)x.classList.add("ko")});after(ok,[[e,ok]],facts(e)+(e.tip?`<br><small>Astuce : ${e.tip}</small>`:""))});
      }else if(ty==="ordre"){
        const first=weighted(dated), src=sameSub(first,dated);
        const four=[first,...shuffled(uniq(src.filter(x=>x.y!==first.y),x=>x.y)).slice(0,3)];
        if(four.length<4){four.length=1;four.push(...shuffled(uniq(dated.filter(x=>x.y!==first.y),x=>x.y)).slice(0,3))}
        const disp=shuffled(four), good=four.slice().sort((a,b)=>a.y-b.y), sel=[];
        pane.innerHTML=frame("Dans l’ordre",`<h3>Du plus ancien au plus récent<span class="sub">Touche les repères dans l’ordre chronologique</span></h3><div class="opts">${disp.map((x,k)=>`<button class="opt ord" data-k="${k}"><b class="num"></b><span>${x.n}<small>${x.r}</small></span></button>`).join("")}</div><div class="row"><button class="btn" id="undo">Effacer</button></div>`);
        const paint=()=>pane.querySelectorAll(".ord").forEach(b=>{const p=sel.indexOf(+b.dataset.k);b.querySelector(".num").textContent=p>=0?p+1:"";b.classList.toggle("sel",p>=0)});
        $("#undo").onclick=()=>{if(pane.querySelector(".opt[disabled]"))return;sel.length=0;paint()};
        pane.querySelectorAll(".ord").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel.includes(k)||b.disabled)return;sel.push(k);paint();
          if(sel.length===4){const res=sel.map((k,p)=>[disp[k],disp[k]===good[p]]);const ok=res.every(r=>r[1]);
            pane.querySelectorAll(".ord").forEach(x=>{x.disabled=true;x.classList.remove("sel");const p=sel.indexOf(+x.dataset.k);x.classList.add(disp[+x.dataset.k]===good[p]?"ok":"ko")});$("#undo").hidden=true;
            after(ok,res,`<ol class="chrono">${good.map(g=>`<li><b>${g.yl}</b> · ${g.n} · ${g.r}</li>`).join("")}</ol>`)}});
      }else{
        const first=weighted(pool), src=sameSub(first,pool);
        const four=[first,...shuffled(uniq(src.filter(x=>x.n!==first.n&&x.r!==first.r),x=>x.n)).slice(0,3)];
        const L=shuffled(four), R=shuffled(four), err=new Set();let cur=null,left=four.length;
        pane.innerHTML=frame("Par paires",`<h3>Associe chaque nom à son repère<span class="sub">Touche un nom, puis son repère</span></h3><div class="pairs"><div>${L.map((x,k)=>`<button class="opt pl" data-k="${k}"><span>${x.n}</span></button>`).join("")}</div><div>${R.map((x,k)=>`<button class="opt pr" data-k="${k}"><span>${x.r}</span></button>`).join("")}</div></div>`);
        pane.querySelectorAll(".pl").forEach(b=>b.onclick=()=>{if(b.disabled)return;pane.querySelectorAll(".pl").forEach(x=>x.classList.remove("sel"));cur=+b.dataset.k;b.classList.add("sel")});
        pane.querySelectorAll(".pr").forEach(b=>b.onclick=()=>{if(b.disabled||cur===null)return;const l=L[cur],r=R[+b.dataset.k],lb=pane.querySelector(`.pl[data-k="${cur}"]`);
          if(l===r){lb.disabled=b.disabled=true;lb.classList.remove("sel");lb.classList.add("ok");b.classList.add("ok");cur=null;left--;
            if(!left){const res=four.map(e=>[e,!err.has(e)]);after(!err.size,res,four.map(facts).join("<br>"))}}
          else{err.add(l);b.classList.add("ko");setTimeout(()=>b.classList.remove("ko"),500)}});
      }
      $("#quit").onclick=menu;
    };
    app.innerHTML=`<div class="mc" style="--c:var(--c-hist)"><div id="pane" class="pane" style="padding-top:18px"></div></div>`;
    if(pool.length<4){menu();return}
    round();window.scrollTo({top:0});
  };
  menu();
}

/* ============ NAVIGATION ============ */
function renderNav(){
  const wr=allWrong().length, cur=view.v==="m"?"":view.v;
  nav.innerHTML=[["home","Accueil",IC.home],["memo","Mémo",IC.memo],["redo","Erreurs",IC.redo],["mix","Quiz",IC.mix]].map(([v,l,ic])=>`<button data-v="${v}" aria-current="${cur===v?"page":"false"}">${ic}<span>${l}</span>${v==="redo"&&wr?`<i class="badge">${wr>99?"99+":wr}</i>`:""}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v,m){view={v,m:m||null,tab:"ess"};try{history.replaceState(null,"",v==="home"?location.pathname+location.search:"#"+(m||v))}catch(e){}render();window.scrollTo({top:0})}
function render(){({home:renderHome,m:renderM,memo:renderMemo,redo:renderRedo,mix:renderMix})[view.v]();bindTheme();renderNav()}
const h0=(location.hash||"").slice(1); if(M[h0]){view.v="m";view.m=h0}else if(["memo","redo","mix"].includes(h0))view.v=h0;
setTheme(theme());
render();

</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
<script>/* Espaces insécables : guillemets et ponctuation double restent collés aux mots */
(function(){const R=[[/« /g,"«\u00A0"],[/ »/g,"\u00A0»"],[/ ([?!:;])/g,"\u00A0$1"]];
function fx(n){const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode:t=>/SCRIPT|STYLE|TEXTAREA|INPUT/.test(t.parentNode&&t.parentNode.nodeName)?2:1});let t;while(t=w.nextNode()){let v=t.nodeValue,o=v;for(const [a,b] of R)v=v.replace(a,b);if(v!==o)t.nodeValue=v}}
let busy=false;const mo=new MutationObserver(ms=>{if(busy)return;busy=true;for(const m of ms){m.addedNodes.forEach(n=>{n.nodeType===3?fx(n.parentNode||document.body):n.nodeType===1&&fx(n)});if(m.type==="characterData")fx(m.target.parentNode||document.body)}mo.takeRecords();busy=false});
addEventListener("DOMContentLoaded",()=>{fx(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true})});})();</script>
